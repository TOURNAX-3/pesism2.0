spring:
  application:
    name: tournax-api
  datasource:
    # Full JDBC URL overrides everything (Supabase: Settings → Database → URI, prefix with jdbc:)
    url: ${DATABASE_URL:jdbc:postgresql://db.${SUPABASE_PROJECT_REF:xjnovjmixytuxopzzrhd}.supabase.co:5432/postgres?sslmode=require}
    username: ${DATABASE_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:${DATABASE_PASSWORD:}}
  jpa:
    hibernate:
      # Flyway owns the schema — never use update/create here
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

tournax:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  registration:
    honeypot-field: website
  admin:
    api-key: ${ADMIN_API_KEY:dev-admin-change-me}
