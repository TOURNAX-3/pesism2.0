spring:
  application:
    name: tournax-api
  datasource:
    # JDBC host only (no user/password in URL — @ in password breaks jdbc:…//user:pass@host).
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema — never use update/create here
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

tournax:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  registration:
    honeypot-field: website
  admin:
    api-key: ${ADMIN_API_KEY:dev-admin-change-me}
