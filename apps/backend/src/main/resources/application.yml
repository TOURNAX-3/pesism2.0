spring:
  application:
    name: tournax-api
  datasource:
    # Set DATABASE_URL in apps/backend/.env (local) or Railway variables (jdbc:postgresql://…)
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      # Flyway owns the schema — never use update/create here
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

tournax:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  registration:
    honeypot-field: website
  admin:
    api-key: ${ADMIN_API_KEY:dev-admin-change-me}
